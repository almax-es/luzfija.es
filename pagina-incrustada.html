<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none';">
<script src="/js/frame-guard.js?v=20261023-095747"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abre esta página en LuzFija.es</title>
<meta name="description" content="LuzFija.es no funciona dentro de otras webs. Abre la página directamente en luzfija.es."/>
<meta name="robots" content="noindex,follow"/>
<link rel="canonical" href="https://luzfija.es/pagina-incrustada.html"/>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  /* Página de aviso a la que js/frame-guard.js lleva cualquier iframe de otra web.
     Autónoma a propósito: no carga la aplicación, la analítica ni las fuentes (en un iframe
     con sandbox el origen es opaco y la descarga de fuentes falla por CORS). */
  :root{ --bg:#070A12; --card:#111522; --border:rgba(255,255,255,.14); --text:#F7F7FB; --muted:rgba(247,247,251,.72); --brand:#A78BFA; --accent:#7C3AED; color-scheme:dark; }
  html.light-mode{ --bg:#F4F6FB; --card:#FFFFFF; --border:rgba(15,23,42,.14); --text:#0F172A; --muted:rgba(15,23,42,.75); --brand:#6D28D9; --accent:#6D28D9; color-scheme:light; }
  html{ background-color: var(--bg); }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
  main{ width:100%; max-width:30rem; box-sizing:border-box; padding:28px 24px; border-radius:18px; border:1px solid var(--border); background:var(--card); text-align:center; }
  .marca{ margin:0 0 8px; font-weight:800; color:var(--brand); letter-spacing:.02em; }
  h1{ margin:0 0 12px; font-size:1.35rem; line-height:1.3; }
  .texto{ margin:0; color:var(--muted); }
  .boton{ display:inline-block; margin-top:20px; padding:12px 22px; border-radius:12px; background:var(--accent); color:#FFFFFF; font-weight:700; text-decoration:none; }
  .boton:hover{ filter:brightness(1.1); }
  .boton:focus-visible{ outline:3px solid var(--brand); outline-offset:3px; }
  .ayuda{ margin:16px 0 0; font-size:.875rem; color:var(--muted); }
  /* Iframes bajos (p. ej. un hueco de 260 px en el movil): el boton tiene que verse sin
     hacer scroll dentro del iframe. La marca sobra, ya esta en el titulo. */
  @media (max-height: 480px){
    body{ padding:8px 12px; }
    main{ padding:14px 16px; }
    .marca{ display:none; }
    h1{ margin-bottom:6px; font-size:1.1rem; }
    .texto{ font-size:.875rem; line-height:1.4; }
    .boton{ margin-top:10px; padding:10px 18px; }
    .ayuda{ margin-top:8px; font-size:.8rem; }
  }
  /* Muy bajos: el boton sube justo detras del titulo y la ayuda se oculta. */
  @media (max-height: 320px){
    main{ display:flex; flex-direction:column; align-items:center; }
    .boton{ order:1; margin:4px 0 0; }
    .texto{ order:2; margin-top:10px; }
    .ayuda{ display:none; }
  }
</style>
</head>
<body>
<main>
  <p class="marca">LuzFija.es</p>
  <h1>Esta página solo se puede usar en LuzFija.es</h1>
  <p class="texto">La estás viendo dentro de otra web. Ábrela directamente para usar la versión original: gratuita, independiente y sin intermediarios.</p>
  <a id="abrir-luzfija" class="boton" href="/" target="_top">Abrir LuzFija.es</a>
  <p class="ayuda">Si el botón no responde, escribe luzfija.es en la barra de direcciones.</p>
</main>
</body>
</html>
