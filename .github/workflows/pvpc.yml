name: PVPC Daily Update

on:
  # Una pasada diaria a las 21:01 UTC (22:01 CET / 23:01 CEST en Madrid), despues de la
  # publicacion habitual de los precios de mañana (~20:15 hora de Madrid). GitHub puede retrasar
  # el cron varias horas (medido del 10/10 al 06/11/2026: entre 2 y 6 h); se acepta, los precios
  # siguen llegando antes del dia al que corresponden. Decision del 06/11/2026: una sola pasada y
  # sin disparador externo; la segunda pasada de seguridad se retiro por redundante.
  # No adelantarla: antes de la publicacion de ESIOS se commitearian datos sin los precios de
  # mañana.
  schedule:
    - cron: '1 21 * * *'

  workflow_dispatch:
    inputs:
      rango:
        description: 'Rango de descarga'
        required: true
        default: 'automatico'
        type: choice
        options:
          - automatico
          - 2021-06-01

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

# Una ejecucion manual puede solaparse con la programada: se encolan.
concurrency:
  group: pvpc-update
  cancel-in-progress: false

jobs:
  update-pvpc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Probar los productores de datos (sin red)
        # Merge diario de PVPC/excedentes y fusion del historico SSAA con ESIOS simulado. Si
        # falla, no se descarga nada ni se toca data/.
        run: python scripts/test_auto_fill.py

      - name: Download PVPC data (six-month correction window)
        env:
          ESIOS_API_KEY: ${{ secrets.ESIOS_API_KEY }}
          RANGO: ${{ github.event.inputs.rango }}
        run: |
          # Si se eligió "desde el principio", pasar --from; si no, modo automático (6 meses)
          FROM_ARG=""
          if [ "$RANGO" = "2021-06-01" ]; then FROM_ARG="--from 2021-06-01"; fi

          # 1. PVPC Consumo (1001)
          python scripts/pvpc_auto_fill.py \
            --out-dir data/pvpc \
            --indicator 1001 \
            --geos 8741 8742 8743 8744 8745 \
            $FROM_ARG

          # 2. PVPC Excedentes (1739)
          python scripts/pvpc_auto_fill.py \
            --out-dir data/surplus \
            --indicator 1739 \
            --geos 8741 8742 8743 8744 8745 \
            $FROM_ARG

          # 3. Servicios de Ajuste del Sistema (10328)
          python scripts/ssaa_auto_fill.py \
            --out-file data/ssaa/index.json \
            --indicator 10328 \
            $FROM_ARG

      - name: Verificar frescura e integridad temporal de datos
        # Falla si la descarga terminó "bien" pero los datos siguen rancios o si
        # falta un día intermedio o queda incompleto/malformado cualquier día ya cerrado.
        # Hoy y futuro pueden estar parciales durante la ventana de publicación de ESIOS.
        # El fallo ocurre antes del commit y genera la notificación de GitHub.
        # El self-test valida primero el propio guard con fixtures sintéticos.
        run: |
          python scripts/check_data_freshness.py --self-test
          python scripts/check_data_freshness.py

      - name: Check if there are changes
        id: check_changes
        run: |
          CHANGED_FILES=$(git status --porcelain -- data/ | wc -l)
          if [ "$CHANGED_FILES" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No hay cambios (datos ya actualizados)"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Actualizados $CHANGED_FILES archivos"
            git status --short -- data/
          fi

      - name: Set up Node.js
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm ci

      - name: Validar integridad de los datasets recien descargados
        # Tests especificos de datos (no "npm test" completo): npm test tiene un
        # pretest -> sync:seo-docs que puede tocar el working tree, algo que no
        # queremos justo antes de un commit/push de datos. tests.yml ya vuelve a
        # correr la suite completa tras el push como segunda comprobacion.
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npx vitest run tests/pvpc-dataset-integrity.test.js tests/ssaa-dataset.test.js tests/surplus-dataset-clock.test.js

      - name: Commit and push if there are changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pvpc/ data/surplus/ data/ssaa/
          HORA=$(TZ=Europe/Madrid date +%H:%M)
          git commit -m "chore: actualizar precios PVPC, Excedentes y SSAA - $HORA"
          git pull --rebase
          git push

      - name: Trigger tests workflow for published data update
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! curl --fail-with-body -L \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/tests.yml/dispatches" \
            -d '{"ref":"main"}'; then
            echo "::error::No se pudo disparar tests.yml tras publicar los datos; la validación completa no se ha lanzado."
            exit 1
          fi

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "Precios actualizados correctamente"
          else
            echo "Datos ya estaban actualizados"
          fi
